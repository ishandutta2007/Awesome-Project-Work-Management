<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0d17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <radialGradient id="glow-indigo" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-cyan" cx="80%" cy="70%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-purple" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="75%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="card-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <linearGradient id="progress-bar-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="shadow-main" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-badge" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .text-title {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        font-size: 46px;
        letter-spacing: -1px;
      }
      .text-subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
        font-size: 17px;
        fill: #94a3b8;
      }
      .text-badge {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 12px;
      }
      .text-code {
        font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, Courier, monospace;
        font-size: 11px;
        fill: #a5b4fc;
      }

      /* Animations */
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes pulseAura {
        0%, 100% { opacity: 0.3; transform: scale(1); }
        50% { opacity: 0.6; transform: scale(1.05); }
      }
      @keyframes streamLine {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes progressAnim {
        0% { width: 40px; }
        50% { width: 140px; }
        100% { width: 40px; }
      }

      .floating-card-left {
        animation: floatSlow 7s ease-in-out infinite;
      }
      .floating-card-right {
        animation: floatReverse 6.5s ease-in-out infinite;
      }
      .pulsing-aura {
        animation: pulseAura 5s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-path {
        stroke-dasharray: 8 8;
        animation: streamLine 12s linear infinite;
      }
      .animated-progress {
        animation: progressAnim 8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" rx="16" />
  <rect width="1200" height="400" fill="url(#grid)" rx="16" />

  <!-- Ambient Glow Circles -->
  <circle cx="150" cy="120" r="220" fill="url(#glow-indigo)" class="pulsing-aura" />
  <circle cx="1050" cy="280" r="240" fill="url(#glow-cyan)" class="pulsing-aura" />
  <circle cx="600" cy="200" r="280" fill="url(#glow-purple)" />

  <!-- Connecting Flow Lines (Visual dynamics in background) -->
  <path class="stream-path" d="M 120 200 C 300 120, 450 280, 600 200 C 750 120, 900 280, 1080 200" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.35" />

  <!-- ================= LEFT FLANK: KANBAN MINI WIDGET ================= -->
  <g class="floating-card-left" transform="translate(60, 65)">
    <!-- Main Card Body -->
    <rect width="210" height="260" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.2" filter="url(#shadow-main)" />
    
    <!-- Header -->
    <rect x="14" y="16" width="36" height="6" rx="3" fill="#6366f1" />
    <text x="58" y="22" fill="#cbd5e1" class="text-badge">Sprint Tasks</text>
    <circle cx="190" cy="20" r="4" fill="#10b981" />

    <!-- Kanban Column 1 Item -->
    <g transform="translate(14, 40)">
      <rect width="182" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="10" y="10" width="60" height="14" rx="4" fill="#3b82f6" fill-opacity="0.25" />
      <text x="16" y="21" fill="#60a5fa" font-size="9" font-family="sans-serif" font-weight="700">IN PROGRESS</text>
      <text x="10" y="38" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="600">Sync Workday HCM</text>
      <circle cx="166" cy="26" r="8" fill="#6366f1" />
      <text x="163" y="29" fill="#ffffff" font-size="8" font-family="sans-serif">JD</text>
    </g>

    <!-- Kanban Column 2 Item -->
    <g transform="translate(14, 102)">
      <rect width="182" height="52" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <rect x="10" y="10" width="50" height="14" rx="4" fill="#10b981" fill-opacity="0.25" />
      <text x="16" y="21" fill="#34d399" font-size="9" font-family="sans-serif" font-weight="700">COMPLETED</text>
      <text x="10" y="38" fill="#e2e8f0" font-size="11" font-family="sans-serif" font-weight="600">Deploy Self-Hosted Plane</text>
      <circle cx="166" cy="26" r="8" fill="#059669" />
      <text x="162" y="29" fill="#ffffff" font-size="8" font-family="sans-serif">✓</text>
    </g>

    <!-- Kanban Column 3 Item (Milestone) -->
    <g transform="translate(14, 164)">
      <rect width="182" height="74" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="10" y="20" fill="#94a3b8" font-size="10" font-family="sans-serif">Release Velocity</text>
      <text x="135" y="20" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="700">94.8%</text>
      <!-- Progress Bar Track -->
      <rect x="10" y="32" width="162" height="6" rx="3" fill="#1e293b" />
      <rect x="10" y="32" width="138" height="6" rx="3" fill="url(#progress-bar-grad)" class="animated-progress" />
      <!-- Metrics -->
      <text x="10" y="58" fill="#64748b" font-size="9" font-family="sans-serif">24 Sprints • 0 Blockers</text>
    </g>
  </g>

  <!-- ================= RIGHT FLANK: GANTT & METRICS MINI WIDGET ================= -->
  <g class="floating-card-right" transform="translate(930, 65)">
    <!-- Main Card Body -->
    <rect width="210" height="260" rx="12" fill="url(#card-bg)" stroke="url(#card-border)" stroke-width="1.2" filter="url(#shadow-main)" />
    
    <!-- Header -->
    <rect x="14" y="16" width="36" height="6" rx="3" fill="#06b6d4" />
    <text x="58" y="22" fill="#cbd5e1" class="text-badge">Gantt Roadmaps</text>
    <circle cx="190" cy="20" r="4" fill="#38bdf8" />

    <!-- Gantt Item 1 -->
    <g transform="translate(14, 42)">
      <text x="4" y="12" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="600">Enterprise Work OS</text>
      <rect x="4" y="20" width="180" height="14" rx="4" fill="#1e293b" />
      <rect x="4" y="20" width="140" height="14" rx="4" fill="#6366f1" fill-opacity="0.8" />
      <text x="12" y="31" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="600">Q3 Milestone</text>
    </g>

    <!-- Gantt Item 2 -->
    <g transform="translate(14, 98)">
      <text x="4" y="12" fill="#cbd5e1" font-size="10" font-family="sans-serif" font-weight="600">Open-Source Migration</text>
      <rect x="4" y="20" width="180" height="14" rx="4" fill="#1e293b" />
      <rect x="40" y="20" width="120" height="14" rx="4" fill="#06b6d4" fill-opacity="0.8" />
      <text x="50" y="31" fill="#ffffff" font-size="9" font-family="sans-serif" font-weight="600">Data Sovereignty</text>
    </g>

    <!-- Metric Stats Badge -->
    <g transform="translate(14, 160)">
      <rect width="182" height="80" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" fill="#94a3b8" font-size="10" font-family="sans-serif">Ecosystem Coverage</text>
      <text x="12" y="48" fill="#38bdf8" font-size="20" font-family="sans-serif" font-weight="800">40+ Tools</text>
      <text x="12" y="66" fill="#10b981" font-size="10" font-family="sans-serif">★ 300k+ Combined Stars</text>
    </g>
  </g>

  <!-- ================= CENTER CONTENT: TITLE & BADGES (FOREGROUND) ================= -->
  <!-- Subtle Badge Pill -->
  <g transform="translate(480, 52)">
    <rect width="240" height="30" rx="15" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle cx="16" cy="15" r="5" fill="#10b981" />
    <text x="32" y="20" fill="#93c5fd" class="text-badge" letter-spacing="0.5">CURATED AWESOME LIST</text>
    <text x="200" y="20" fill="#cbd5e1" font-size="12">⚡</text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 142)">
    <text text-anchor="middle" fill="url(#title-grad)" class="text-title" filter="url(#shadow-main)">Awesome Project &amp; Work Management</text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 185)">
    <text text-anchor="middle" class="text-subtitle">
      Enterprise SaaS Platforms • Agile Sprints • Data-Sovereign Open-Source Stacks
    </text>
  </g>

  <!-- Keyword Highlights Banner -->
  <g transform="translate(600, 222)">
    <text text-anchor="middle" fill="#64748b" font-family="sans-serif" font-size="13" font-weight="500">
      Task Orchestration  |  Gantt Roadmaps  |  Kanban Boards  |  Resource Planning  |  Self-Hosted Workspaces
    </text>
  </g>

  <!-- Feature Pills Row -->
  <g transform="translate(325, 260)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="21" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">🏢 SaaS Titans</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(138, 0)">
      <rect width="135" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="21" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">🔓 Open-Source</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(285, 0)">
      <rect width="130" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="21" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">💰 Pricing Matrix</text>
    </g>

    <!-- Pill 4 -->
    <g transform="translate(427, 0)">
      <rect width="125" height="34" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="21" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="600">📊 Star Metrics</text>
    </g>
  </g>

  <!-- Footer Stats Bar -->
  <g transform="translate(600, 345)">
    <text text-anchor="middle" class="text-code">
      ★ COMMUNITY-CURATED • CONTINUOUSLY UPDATED FOR 2026 • CONTRIBUTIONS WELCOME ★
    </text>
  </g>
</svg>
